<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e3dfd3"/>
      <stop offset="100%" stop-color="#aba698"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6fc"/>
      <stop offset="100%" stop-color="#cbd8ec"/>
    </linearGradient>
  </defs>
  <!-- Stand -->
  <ellipse cx="60" cy="99" rx="30" ry="6" fill="#9e9a8e" stroke="#757166" stroke-width="1"/>
  <path d="M46,80 L74,80 L78,97 L42,97 Z" fill="url(#bezel)" stroke="#858175" stroke-width="1"/>
  <!-- Monitor body -->
  <rect x="14" y="8" width="92" height="74" rx="6" fill="url(#bezel)" stroke="#7c786c" stroke-width="1.5"/>
  <rect x="22" y="15" width="76" height="56" rx="2" fill="url(#screen)" stroke="#68645a" stroke-width="1.5"/>
  <!-- XP Flag inside screen -->
  <g transform="translate(36, 22) scale(1.5)">
    <path d="M5,5 Q10,2 15,5 L13,13 Q8,10 3,13 Z" fill="#e8381c"/>
    <path d="M17,6 Q22,9 27,6 L25,14 Q20,17 15,14 Z" fill="#68c424"/>
    <path d="M3,15 Q8,12 13,15 L11,23 Q6,20 1,23 Z" fill="#1c70d8"/>
    <path d="M15,16 Q20,19 25,16 L23,24 Q18,27 13,24 Z" fill="#f8b810"/>
  </g>
  <!-- Power LED -->
  <circle cx="94" cy="76" r="2" fill="#4cd938"/>
</svg>