<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 172" width="356" height="172">
  <defs>
    <linearGradient id="inactTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9cb7e8"/>
      <stop offset="100%" stop-color="#7697dc"/>
    </linearGradient>
    <linearGradient id="actTitle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c7ff7"/>
      <stop offset="18%" stop-color="#0a5cd6"/>
      <stop offset="85%" stop-color="#0855cb"/>
      <stop offset="100%" stop-color="#0541a5"/>
    </linearGradient>
  </defs>
  <!-- Classic XP Teal/Blue Preview Background -->
  <rect x="0" y="0" width="356" height="172" fill="#004e98" stroke="#8a867a" stroke-width="2"/>
  
  <!-- Inactive Window -->
  <rect x="12" y="10" width="305" height="126" rx="5" fill="#ece9d8" stroke="#5b7bc0" stroke-width="2"/>
  <path d="M13,15 Q13,11 17,11 L312,11 Q316,11 316,15 L316,33 L13,33 Z" fill="url(#inactTitle)"/>
  <text x="20" y="26" font-family="Tahoma" font-size="11" font-weight="bold" fill="#d8e4f8">Inactive Window</text>
  <rect x="256" y="14" width="16" height="16" rx="2" fill="#7c9ce0" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="275" y="14" width="16" height="16" rx="2" fill="#7c9ce0" stroke="#ffffff" stroke-width="0.8"/>
  <rect x="294" y="14" width="16" height="16" rx="2" fill="#c77a72" stroke="#ffffff" stroke-width="0.8"/>

  <!-- Active Window -->
  <rect x="22" y="30" width="318" height="128" rx="5" fill="#0855cb" stroke="#05398c" stroke-width="2"/>
  <path d="M23,35 Q23,31 27,31 L335,31 Q339,31 339,35 L339,55 L23,55 Z" fill="url(#actTitle)"/>
  <text x="30" y="47" font-family="Tahoma" font-size="11" font-weight="bold" fill="#ffffff">Active Window</text>
  <!-- Min/Max/Close buttons -->
  <rect x="278" y="35" width="17" height="17" rx="2" fill="#2570e8" stroke="#ffffff" stroke-width="1"/>
  <line x1="282" y1="48" x2="288" y2="48" stroke="#ffffff" stroke-width="2"/>
  <rect x="298" y="35" width="17" height="17" rx="2" fill="#2570e8" stroke="#ffffff" stroke-width="1"/>
  <rect x="302" y="39" width="9" height="9" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="318" y="35" width="17" height="17" rx="2" fill="#e04b38" stroke="#ffffff" stroke-width="1"/>
  <path d="M322,39 L331,48 M331,39 L322,48" stroke="#ffffff" stroke-width="2"/>
  <!-- Active Window Client Area -->
  <rect x="25" y="55" width="312" height="100" fill="#ffffff"/>
  <text x="30" y="70" font-family="Tahoma" font-size="11" fill="#000000">Window Text</text>
  <!-- Scrollbar on right of Active Window -->
  <rect x="321" y="55" width="16" height="100" fill="#f1efe2"/>
  <rect x="322" y="56" width="14" height="14" rx="2" fill="#c8daf8"/>
  <rect x="322" y="71" width="14" height="22" rx="2" fill="#b8d0f8"/>
  <rect x="322" y="140" width="14" height="14" rx="2" fill="#c8daf8"/>

  <!-- Message Box -->
  <rect x="118" y="72" width="126" height="72" rx="4" fill="#ece9d8" stroke="#0855cb" stroke-width="2"/>
  <path d="M119,76 Q119,73 122,73 L240,73 Q243,73 243,76 L243,94 L119,94 Z" fill="url(#actTitle)"/>
  <text x="125" y="88" font-family="Tahoma" font-size="11" font-weight="bold" fill="#ffffff">Message Box</text>
  <rect x="223" y="76" width="16" height="16" rx="2" fill="#e04b38" stroke="#ffffff" stroke-width="1"/>
  <path d="M227,80 L235,88 M235,80 L227,88" stroke="#ffffff" stroke-width="1.8"/>
  <!-- OK button inside Message Box -->
  <rect x="148" y="108" width="66" height="23" rx="3" fill="#f5f4ea" stroke="#003c74" stroke-width="1"/>
  <text x="173" y="123" font-family="Tahoma" font-size="11" fill="#000000">OK</text>
</svg>