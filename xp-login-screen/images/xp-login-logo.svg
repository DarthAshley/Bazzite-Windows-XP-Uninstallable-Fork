<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 135" width="260" height="135">
  <defs>
    <!-- Red pane gradient -->
    <linearGradient id="xpRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="35%" stop-color="#f2491d"/>
      <stop offset="100%" stop-color="#b82306"/>
    </linearGradient>
    <!-- Green pane gradient -->
    <linearGradient id="xpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2ff66"/>
      <stop offset="40%" stop-color="#68c91e"/>
      <stop offset="100%" stop-color="#358507"/>
    </linearGradient>
    <!-- Blue pane gradient -->
    <linearGradient id="xpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75baff"/>
      <stop offset="40%" stop-color="#2673e0"/>
      <stop offset="100%" stop-color="#0b3f9c"/>
    </linearGradient>
    <!-- Yellow pane gradient -->
    <linearGradient id="xpYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="40%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#d68800"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.2" flood-color="#1d3c8c" flood-opacity="0.72"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1.2" flood-color="#1d3c8c" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D Waving Windows XP Flag -->
  <g filter="url(#dropShadow)" transform="translate(86, 4)">
    <!-- Top-Left (Red) -->
    <path d="M 18,8 C 31,1 44,4 55,11 L 47,41 C 36,34 23,31 10,38 Z" fill="url(#xpRed)" stroke="#8c1900" stroke-width="0.6"/>
    <!-- Top-Right (Green) -->
    <path d="M 60,13 C 71,20 84,22 97,14 L 89,44 C 76,52 63,50 52,43 Z" fill="url(#xpGreen)" stroke="#246300" stroke-width="0.6"/>
    <!-- Bottom-Left (Blue) -->
    <path d="M 9,43 C 22,36 35,39 46,46 L 38,76 C 27,69 14,66 1,73 Z" fill="url(#xpBlue)" stroke="#072c73" stroke-width="0.6"/>
    <!-- Bottom-Right (Yellow) -->
    <path d="M 51,48 C 62,55 75,57 88,49 L 80,79 C 67,87 54,85 43,78 Z" fill="url(#xpYellow)" stroke="#9e6200" stroke-width="0.6"/>
  </g>

  <!-- Microsoft® -->
  <text x="26" y="88" font-family="Tahoma, 'Noto Sans', sans-serif" font-size="13.5" fill="#ffffff" filter="url(#textShadow)" letter-spacing="0.2">Microsoft<tspan font-size="8" baseline-shift="super">®</tspan></text>

  <!-- Windows -->
  <text x="24" y="123" font-family="'Franklin Gothic Medium', Tahoma, 'Noto Sans', sans-serif" font-size="40" font-weight="bold" fill="#ffffff" filter="url(#textShadow)" letter-spacing="-0.8">Windows</text>

  <!-- xp superscript in orange -->
  <text x="193" y="106" font-family="'Franklin Gothic Medium', Tahoma, 'Noto Sans', sans-serif" font-size="23" font-weight="bold" fill="#ff6814" filter="url(#textShadow)" letter-spacing="-0.5">xp</text>
</svg>
